name: SIRUTA mirror probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/siruta-probe.yml']

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect maintained SIRUTA Python package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p siruta
          python -m pip install -q sirutalib==1.3.0
          python - <<'PY'
          import pathlib, sirutalib, shutil
          root=pathlib.Path(sirutalib.__file__).resolve().parent
          print('package root', root)
          files=[]
          for base in {root, root.parent}:
              files += list(base.rglob('siruta*.csv'))
              files += list(base.rglob('SIRUTA*.csv'))
          seen=[]
          for p in files:
              if p.is_file() and p not in seen:
                  seen.append(p); print(p, p.stat().st_size)
          if not seen:
              raise SystemExit('no SIRUTA CSV found in package')
          src=max(seen,key=lambda p:p.stat().st_size)
          shutil.copy2(src,'siruta/siruta.csv')
          print('selected',src)
          PY
          wc -c siruta/siruta.csv
          sha256sum siruta/siruta.csv
          head -3 siruta/siruta.csv || true
      - uses: actions/upload-artifact@v4
        with:
          name: siruta-maintained-mirror
          path: siruta/siruta.csv
          retention-days: 2
