name: AFIR independent territory audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-territory-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch fresh GAL territory pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p territory-audit
          date -u +'%Y-%m-%dT%H:%M:%SZ' > territory-audit/fetched_at_utc.txt
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36 independent-QA'
          gals=(
            d4228448-2a44-455a-a7e2-432cd7775c18
            842fbd5d-de19-4749-a068-e123a428d7d3
            7d22fb3f-4899-4c0f-b8a3-de21aaf05c5d
            8c4a9e5d-2ae5-429e-9fc6-b3ac3777bf9a
            9fca4f67-eba1-483c-980f-eb2ba73a0b81
            e4a86917-7b56-432b-8d6e-1b9fd94f0b78
            d1afb996-73b6-49a2-bc65-0481ec192835
            89ce6b1b-cbd1-4be1-806f-79e0cbad96a5
          )
          for gid in "${gals[@]}"; do
            curl -fLsS --retry 3 --retry-delay 1 -A "$UA" "https://gal.afir.ro/Gal?g=$gid" -o "territory-audit/$gid.html"
            sleep 0.15
          done

      - name: Independently validate live intervention section boundaries
        shell: bash
        run: |
          set -euo pipefail
          pip -q install beautifulsoup4 lxml
          python - <<'PY'
          from bs4 import BeautifulSoup, Tag
          from pathlib import Path
          import json, re

          report=[]
          for p in sorted(Path('territory-audit').glob('*.html')):
              soup=BeautifulSoup(p.read_text(encoding='utf-8',errors='replace'),'lxml')
              heading=None
              for h in soup.find_all(['h1','h2','h3','h4','h5','h6']):
                  key=h.get_text(' ',strip=True).casefold().replace('ț','t').replace('ţ','t')
                  if 'lista intervent' in key:
                      heading=h; break
              if heading is None:
                  raise SystemExit(f'Missing Lista Intervenții heading in {p.name}')
              ul=None
              for sibling in heading.next_siblings:
                  if not isinstance(sibling,Tag): continue
                  if sibling.name in {'h1','h2','h3','h4','h5','h6'}: break
                  if sibling.name=='ul': ul=sibling; break
                  candidate=sibling.find('ul')
                  if candidate is not None: ul=candidate; break
              if ul is None:
                  raise SystemExit(f'Missing bounded intervention list in {p.name}')
              rows=[' '.join(li.get_text(' ',strip=True).split()).lstrip('• ') for li in ul.find_all('li',recursive=False)]
              rows=[x for x in rows if x]
              bad=[x for x in rows if not re.match(r'^[A-Za-z]+\d+\s*-',x)]
              noise=[x for x in rows if 'urmăriți-ne pe' in x.casefold() or 'lansată în data de' in x.casefold()]
              if bad or noise:
                  raise SystemExit(f'Invalid intervention rows in {p.name}: bad={bad} noise={noise}')
              report.append({'gal_id':p.stem,'intervention_count':len(rows),'interventions':rows})
          Path('territory-audit/intervention_scope_report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Independent territory intervention audit PASS:',sum(x['intervention_count'] for x in report),'rows across',len(report),'GALs')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: afir-independent-territory-audit
          path: territory-audit/**
          retention-days: 3
