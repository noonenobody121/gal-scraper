name: AFIR full national extraction

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ci/chunks/**'
      - 'ci/apply_live_fixes.py'
      - 'ci/apply_final_fixes.py'
      - 'ci/apply_cleanup_fixes.py'
      - 'ci/test_cleanup_regression.py'
      - 'ci/ci_full_extract_v3.py'
      - '.github/workflows/full-extract.yml'

permissions:
  contents: read

concurrency:
  group: afir-full-extraction
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct, patch, and verify extractor
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ci-src && mkdir -p ci-src
          cat ci/chunks/00.b64 ci/chunks/01.b64 ci/chunks/02.b64 ci/chunks/03a.b64 ci/chunks/03b.b64 ci/chunks/04.b64 ci/chunks/05.b64 | base64 -d > /tmp/gal_scraper_ci_source.zip
          actual_sha=$(sha256sum /tmp/gal_scraper_ci_source.zip | awk '{print $1}')
          test "$actual_sha" = "57d34e116ec97d48d3748a0283331c3f8d223ac7d00d88c8822e7453f3bb826b"
          unzip -tq /tmp/gal_scraper_ci_source.zip
          unzip -q /tmp/gal_scraper_ci_source.zip -d ci-src
          python ci/apply_live_fixes.py ci-src
          python ci/apply_final_fixes.py ci-src
          python ci/apply_cleanup_fixes.py ci-src
          cp ci/ci_full_extract_v3.py ci-src/ci_full_extract.py
          cp ci/test_cleanup_regression.py ci-src/test_cleanup_regression.py
          python -m compileall -q ci-src/afir_gal ci-src/ci_full_extract.py ci-src/test_cleanup_regression.py
          grep -q 'ListaApeluri' ci-src/afir_gal/crawler.py
          grep -q 'data-gal-id' ci-src/afir_gal/manifest.py
          grep -q 'intervention_list' ci-src/afir_gal/parsers.py
          grep -q 'UNCODED_INTERVENTION' ci-src/afir_gal/quality.py

      - name: Install dependencies and SIRUTA registry mirror
        working-directory: ci-src
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt sirutalib==1.3.0
          python - <<'PY'
          import pathlib, shutil, sirutalib
          root=pathlib.Path(sirutalib.__file__).resolve().parent
          files=[]
          for base in {root,root.parent}:
              files += list(base.rglob('siruta*.csv')) + list(base.rglob('SIRUTA*.csv'))
          files=[p for p in files if p.is_file()]
          if not files: raise SystemExit('No SIRUTA CSV in sirutalib package')
          src=max(files,key=lambda p:p.stat().st_size)
          shutil.copy2(src,'siruta.csv')
          print('SIRUTA mirror',src,'rows',sum(1 for _ in open('siruta.csv',encoding='utf-8-sig',errors='replace')))
          PY

      - name: Run intervention contamination regression
        working-directory: ci-src
        shell: bash
        run: |
          set -euo pipefail
          python test_cleanup_regression.py

      - name: Run full crawl
        id: crawl
        continue-on-error: true
        working-directory: ci-src
        shell: bash
        run: |
          set +e
          python ci_full_extract.py 2>&1 | tee output.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preserve runner log
        if: always()
        run: |
          mkdir -p ci-src/output
          cp ci-src/output.log ci-src/output/workflow_output.log || true

      - name: Upload extraction artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afir-national-extraction-clean
          path: ci-src/output/**
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce reconciliation result
        if: always()
        shell: bash
        run: |
          code='${{ steps.crawl.outputs.exit_code }}'
          if [ -z "$code" ]; then code=99; fi
          exit "$code"
